[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "douban-backup"
version = "1.8"
description = "豆瓣个人数据备份工具 — 导出电影、书籍、音乐、游戏和长评"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "zx2592" }]
keywords = ["douban", "backup", "export", "豆瓣", "备份"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "openpyxl>=3.0.0",
    "beautifulsoup4>=4.11.0",
]

[project.urls]
Homepage = "https://github.com/zx2592/douban_backup"
Issues = "https://github.com/zx2592/douban_backup/issues"

[project.scripts]
douban-backup = "main:cli_entry"
douban-backup-public = "crawl_public:cli_entry"
douban-import-cookies = "import_cookies:main"

# 模块都在仓库根目录平铺，没有包目录。逐个列出比让 setuptools 自动发现
# 更稳妥——自动发现会把 tests 之类的目录一并当成包。
[tool.setuptools]
py-modules = [
    "main",
    "auth",
    "base",
    "books",
    "cli",
    "config",
    "covers",
    "crawl_public",
    "backup_metadata",
    "backup_state",
    "diagnostics",
    "excel_safety",
    "file_security",
    "games",
    "import_cookies",
    "incremental",
    "movies",
    "music",
    "reviews",
    "storage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
